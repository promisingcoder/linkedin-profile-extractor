app = "linkedin-profile-extractor"
primary_region = "iad" # US East (Virginia)

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"
  release_command = "python -m pip install -r requirements.txt"

[env]
  PORT = "8000"
  PYTHONUNBUFFERED = "1"
  PRIMARY_REGION = "iad"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 500

  [[http_service.checks]]
    interval = "60s"
    timeout = "10s"
    grace_period = "120s"
    method = "GET"
    path = "/docs"
    protocol = "http"
    tls_skip_verify = false

[metrics]
  port = 9091
  path = "/metrics" 